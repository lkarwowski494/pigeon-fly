name: CI Quality Gate & Timezone Matrix

on:
  push:
    branches: [main, master, 'remediation/**']
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Verify (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        tz:
          - 'UTC'
          - 'America/New_York'
          - 'Europe/Warsaw'
          - 'Asia/Tokyo'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Internationalization Parity Check
        run: npm run check:i18n

      - name: Jest Test Suite (TZ=${{ matrix.tz }})
        env:
          TZ: ${{ matrix.tz }}
          PROP_SEED: 20261018
        run: npm test
